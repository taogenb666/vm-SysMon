<!doctype html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SysMon · 历史趋势</title>
<link href="/static/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
<link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar sticky-top sysmon-navbar">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">🖥️ SysMon</a>
    <div class="d-flex align-items-center gap-3">
      <span class="text-secondary small">历史趋势</span>
      <a class="btn btn-sm btn-outline-light" href="/">实时面板</a>
    </div>
  </div>
</nav>

<main class="container-fluid py-3">
  <div class="row g-3">
    <div class="col-12 col-xl-3">
      <div class="card sysmon-card">
        <div class="card-body">
          <div class="card-title-row"><span>查询条件</span></div>
          <label class="form-label small text-secondary">时间范围</label>
          <div class="d-flex flex-wrap gap-1 mb-2" id="range-presets">
            <button type="button" class="btn btn-sm btn-outline-info" data-range="900">15 分</button>
            <button type="button" class="btn btn-sm btn-outline-info" data-range="3600">1 小时</button>
            <button type="button" class="btn btn-sm btn-outline-info" data-range="21600">6 小时</button>
            <button type="button" class="btn btn-sm btn-outline-info" data-range="86400">24 小时</button>
            <button type="button" class="btn btn-sm btn-outline-info" data-range="604800">7 天</button>
          </div>
          <div class="row g-2 mb-2">
            <div class="col-6">
              <label class="form-label small text-secondary">开始</label>
              <input type="datetime-local" class="form-control form-control-sm" id="start-time">
            </div>
            <div class="col-6">
              <label class="form-label small text-secondary">结束</label>
              <input type="datetime-local" class="form-control form-control-sm" id="end-time">
            </div>
          </div>
          <label class="form-label small text-secondary">按类整组显示</label>
          <div class="d-flex flex-wrap gap-1 mb-3" id="group-buttons"></div>

          <label class="form-label small text-secondary">指标（点击即查询，可多选）</label>
          <select class="form-select form-select-sm" id="metric-select" multiple size="12"></select>
          <div class="text-secondary small mt-2" id="query-status"></div>
          <div class="text-secondary small mt-1" style="opacity:.75">Ctrl / Cmd + 点击可多选叠加对比</div>
        </div>
      </div>
    </div>

    <div class="col-12 col-xl-9">
      <div class="card sysmon-card">
        <div class="card-body">
          <div class="card-title-row"><span>趋势图</span><span class="text-secondary small" id="chart-range">--</span></div>
          <div id="chart-history" class="chart" style="height:420px"></div>
        </div>
      </div>
    </div>

    <div class="col-12" id="alerts">
      <div class="card sysmon-card">
        <div class="card-body">
          <div class="card-title-row"><span>告警规则</span><span class="text-secondary small" id="rules-status"></span></div>
          <div class="table-responsive">
            <table class="table table-dark table-sm align-middle">
              <thead><tr><th>ID</th><th>指标</th><th>条件</th><th>持续(秒)</th><th>启用</th><th>说明</th><th class="text-end">操作</th></tr></thead>
              <tbody id="rules-body"></tbody>
            </table>
          </div>
          <form class="row g-2 align-items-end mt-3" id="rule-form">
            <div class="col-12 col-md-3">
              <label class="form-label small text-secondary">指标</label>
              <select class="form-select form-select-sm" id="rule-metric"></select>
            </div>
            <div class="col-4 col-md-2">
              <label class="form-label small text-secondary">运算符</label>
              <select class="form-select form-select-sm" id="rule-op"></select>
            </div>
            <div class="col-4 col-md-2">
              <label class="form-label small text-secondary">阈值</label>
              <input type="number" step="any" class="form-control form-control-sm" id="rule-threshold" value="90">
            </div>
            <div class="col-4 col-md-2">
              <label class="form-label small text-secondary">持续(秒)</label>
              <input type="number" min="0" class="form-control form-control-sm" id="rule-duration" value="5">
            </div>
            <div class="col-12 col-md-2">
              <label class="form-label small text-secondary">说明</label>
              <input type="text" class="form-control form-control-sm" id="rule-note" placeholder="可选">
            </div>
            <div class="col-12 col-md-1">
              <button class="btn btn-info btn-sm w-100" type="submit">添加</button>
            </div>
          </form>
          <div class="text-secondary small mt-2" id="form-error"></div>
        </div>
      </div>
    </div>
  </div>
</main>

<div id="sysmon-toast" class="sysmon-toast"></div>

<script src="/static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/static/vendor/echarts/echarts.min.js"></script>
<script src="/static/js/common.js"></script>
<script src="/static/js/history.js"></script>
</body>
</html>
